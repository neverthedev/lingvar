name: lingvar-tests

services:
  postgres-test:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: lingvar_test
      POSTGRES_USER: lingvar_test_user
      POSTGRES_PASSWORD: lingvar_test_password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lingvar_test_user -d lingvar_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend-tests:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      TEST_DATABASE_URL: postgresql://lingvar_test_user:lingvar_test_password@postgres-test:5432/lingvar_test
      DATABASE_URL: postgresql://lingvar_test_user:lingvar_test_password@postgres-test:5432/lingvar_test
      PYTHONPATH: /app
    volumes:
      - ./backend:/app:ro
    depends_on:
      postgres-test:
        condition: service_healthy
    command: sh -c "pip install --no-cache-dir -r requirements-test.txt && python -m pytest -q -p no:cacheprovider tests"

  browser-tests:
    build:
      context: .
      dockerfile: tests/browser/Dockerfile
    environment:
      TEST_DATABASE_URL: postgresql://lingvar_test_user:lingvar_test_password@postgres-test:5432/lingvar_test
    depends_on:
      postgres-test:
        condition: service_healthy
